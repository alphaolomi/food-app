name: foodapp
description: Customer food ordering app for Android and iOS (dev.alphaolomi.foodapp). Pair with food-server API.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  provider: ^6.1.5+1
  flutter_svg: ^2.2.4
  intl: ^0.20.2
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

# dart run flutter_launcher_icons  (requires assets/branding/app_icon.png — see tool/generate_app_icon.dart)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  min_sdk_android: 21
